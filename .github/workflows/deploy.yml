name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests before deploy
        run: pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t ultron-lightweight:${{ github.sha }} -f deployment/Dockerfile .

      # Add your AWS ECR push / ECS / Lambda deploy steps here.
